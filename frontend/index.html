<!doctype html>
<html lang="zh-CN" class="">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8fafc" />
    <meta name="description" content="wmind — 可自托管的思维导图系统" />
    <link rel="icon" type="image/jpeg" href="/wmind-logo.jpg" />
    <title>wmind · 思维导图</title>
    <script>
      (() => {
        try {
          const preference = localStorage.getItem('wmind:theme') || 'system';
          const dark = preference === 'dark' || (preference === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch {
          // Private browsing may disable localStorage; the CSS system preference remains available.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
