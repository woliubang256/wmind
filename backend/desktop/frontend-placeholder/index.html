<!doctype html>
<!--
  占位页：默认构建（不带 desktopfrontend 标签）时嵌进桌面二进制，提示前端
  尚未构建。正式产物由 scripts/build-desktop.mjs 写入 backend/desktop/frontend-dist
  并以 -tags desktopfrontend 编译（该目录不进版本库）。
-->
<html lang="zh-CN">
  <head><meta charset="utf-8" /><title>wmind</title></head>
  <body style="font: 14px/1.7 -apple-system, system-ui, sans-serif; margin: 3rem; max-width: 40rem">
    <h1 style="font-size: 1.25rem">wmind 桌面版尚未构建前端</h1>
    <p>当前运行的是占位页面。请在仓库根目录执行：</p>
    <pre style="background: #f5f5f5; padding: 1rem; border-radius: 8px">node scripts/build-desktop.mjs</pre>
    <p>它会构建前端、嵌入产物并编译桌面二进制。</p>
  </body>
</html>
