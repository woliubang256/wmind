name: wmind

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    image: wmind/api:${WMIND_VERSION:-latest}
    restart: unless-stopped
    environment:
      WMIND_ENV: production
      WMIND_ADDR: ":8080"
      WMIND_DB_DRIVER: sqlite
      WMIND_SQLITE_PATH: /data/wmind.db
      WMIND_JWT_SECRET: ${WMIND_JWT_SECRET:?Set WMIND_JWT_SECRET in .env}
      WMIND_2FA_ENCRYPTION_KEY: ${WMIND_2FA_ENCRYPTION_KEY:-}
      WMIND_STORAGE_DRIVER: local
      WMIND_STORAGE_DIR: /data/uploads
      WMIND_AUTO_MIGRATE: "true"
      WMIND_LOG_LEVEL: ${WMIND_LOG_LEVEL:-info}
      WMIND_ADMIN_EMAIL: ${WMIND_ADMIN_EMAIL:-}
      WMIND_ADMIN_PASSWORD: ${WMIND_ADMIN_PASSWORD:-}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - data:/data
    networks: [wmind]
    stop_grace_period: 20s
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    image: wmind/web:${WMIND_VERSION:-latest}
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "${HTTP_PORT:-80}:80"
    networks: [wmind]
    security_opt:
      - no-new-privileges:true

volumes:
  data:

networks:
  wmind:
    driver: bridge
