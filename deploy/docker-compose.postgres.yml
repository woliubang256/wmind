name: wmind

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wmind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-wmind}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wmind} -d ${POSTGRES_DB:-wmind}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [wmind]
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    image: wmind/api:${WMIND_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      WMIND_ENV: production
      WMIND_ADDR: ":8080"
      WMIND_DB_DRIVER: postgres
      WMIND_DATABASE_URL: postgres://${POSTGRES_USER:-wmind}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-wmind}?sslmode=disable
      WMIND_DB_MAX_CONNS: ${WMIND_DB_MAX_CONNS:-20}
      WMIND_JWT_SECRET: ${WMIND_JWT_SECRET:?Set WMIND_JWT_SECRET in .env}
      WMIND_2FA_ENCRYPTION_KEY: ${WMIND_2FA_ENCRYPTION_KEY:-}
      WMIND_STORAGE_DRIVER: local
      WMIND_STORAGE_DIR: /data/uploads
      WMIND_AUTO_MIGRATE: "true"
      WMIND_LOG_LEVEL: ${WMIND_LOG_LEVEL:-info}
      WMIND_ADMIN_EMAIL: ${WMIND_ADMIN_EMAIL:-}
      WMIND_ADMIN_PASSWORD: ${WMIND_ADMIN_PASSWORD:-}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - uploads:/data/uploads
    networks: [wmind]
    stop_grace_period: 20s
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    image: wmind/web:${WMIND_VERSION:-latest}
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "${HTTP_PORT:-80}:80"
    networks: [wmind]
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
  uploads:

networks:
  wmind:
    driver: bridge
