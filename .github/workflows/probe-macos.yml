name: Probe macOS runner
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-macos.yml']
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-13, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - run: echo "ok ${{ matrix.os }}" && uname -a
