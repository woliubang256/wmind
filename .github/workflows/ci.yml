name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: wmind_test
          POSTGRES_USER: wmind
          POSTGRES_PASSWORD: wmind_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wmind -d wmind_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      WMIND_TEST_DATABASE_URL: postgres://wmind:wmind_ci_password@localhost:5432/wmind_test?sslmode=disable
      WMIND_VERSION: ${{ github.ref_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Verify release tag and version
        run: node scripts/release.mjs check "$GITHUB_REF_NAME"

      - name: Test release tooling
        run: npm run test:release

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install sqlc
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Verify generated database code
        working-directory: backend/db
        run: |
          sqlc generate
          git diff --exit-code -- ../internal/repository/postgres/pgdb ../internal/repository/sqlite/sqlitedb

      - name: Verify architecture notes
        run: npm run verify-notes

      - name: Check palette contrast
        run: npm run check:palette

      # 缺分片不报错、只显示方框，必须在构建期挡住（ADR-016）。
      - name: Check font shards
        run: npm run check:fonts

      - name: Verify dialect boundaries
        working-directory: backend
        run: go run ./cmd/dialectcheck .

      - name: Verify migrations against SQLite and PostgreSQL
        working-directory: backend
        run: go run ./cmd/verifyparity

      - name: Run tests
        working-directory: backend
        run: go test ./...

      - name: Run static analysis
        working-directory: backend
        run: go vet ./...

      - name: Type-check and test frontend
        working-directory: frontend
        run: pnpm typecheck && pnpm test

      - name: Build frontend
        working-directory: frontend
        run: pnpm build

      - name: Check deployment configuration
        env:
          WMIND_JWT_SECRET: ci-only-test-secret-that-is-not-used-in-production
          POSTGRES_PASSWORD: wmind_ci_password
        run: |
          docker compose -f deploy/docker-compose.yml config --quiet
          docker compose -f deploy/docker-compose.postgres.yml config --quiet

      - name: Generate changelog and deployment archives
        run: |
          node scripts/release.mjs changelog "$GITHUB_REF_NAME" release/CHANGELOG.md
          node scripts/release.mjs package "$GITHUB_REF_NAME" release

      - name: Set up target platform emulation
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.backend
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/woliubang256/wmind-api:${{ github.ref_name }}
            ghcr.io/woliubang256/wmind-api:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha,scope=wmind-api
          cache-to: type=gha,mode=max,scope=wmind-api

      - name: Build and publish Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/woliubang256/wmind-web:${{ github.ref_name }}
            ghcr.io/woliubang256/wmind-web:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha,scope=wmind-web
          cache-to: type=gha,mode=max,scope=wmind-web

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: wmind ${{ github.ref_name }}
          body_path: release/CHANGELOG.md
          files: |
            release/*.tar.gz
            release/SHA256SUMS
            release/CHANGELOG.md
          fail_on_unmatched_files: true
          draft: false
