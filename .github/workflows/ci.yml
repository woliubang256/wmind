name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: wmind_test
          POSTGRES_USER: wmind
          POSTGRES_PASSWORD: wmind_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wmind -d wmind_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      WMIND_TEST_DATABASE_URL: postgres://wmind:wmind_ci_password@localhost:5432/wmind_test?sslmode=disable
      WMIND_VERSION: ${{ github.ref_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Verify release tag and version
        run: node scripts/release.mjs check "$GITHUB_REF_NAME"

      - name: Test release tooling
        run: npm run test:release

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install sqlc
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Verify generated database code
        working-directory: backend/db
        run: |
          sqlc generate
          git diff --exit-code -- ../internal/repository/postgres/pgdb ../internal/repository/sqlite/sqlitedb

      - name: Verify architecture notes
        run: npm run verify-notes

      - name: Check palette contrast
        run: npm run check:palette

      # 缺分片不报错、只显示方框，必须在构建期挡住（ADR-016）。
      - name: Check font shards
        run: npm run check:fonts

      - name: Verify dialect boundaries
        working-directory: backend
        run: go run ./cmd/dialectcheck .

      - name: Verify migrations against SQLite and PostgreSQL
        working-directory: backend
        run: go run ./cmd/verifyparity

      - name: Run tests
        working-directory: backend
        run: go test ./...

      - name: Run static analysis
        working-directory: backend
        run: go vet ./...

      - name: Type-check and test frontend
        working-directory: frontend
        run: pnpm typecheck && pnpm test

      - name: Build frontend
        working-directory: frontend
        run: pnpm build

      - name: Check deployment configuration
        env:
          WMIND_JWT_SECRET: ci-only-test-secret-that-is-not-used-in-production
          POSTGRES_PASSWORD: wmind_ci_password
        run: |
          docker compose -f deploy/docker-compose.yml config --quiet
          docker compose -f deploy/docker-compose.postgres.yml config --quiet

      - name: Generate changelog and deployment archives
        run: |
          node scripts/release.mjs changelog "$GITHUB_REF_NAME" release/CHANGELOG.md
          node scripts/release.mjs package "$GITHUB_REF_NAME" release

      - name: Set up target platform emulation
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.backend
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/woliubang256/wmind-api:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha,scope=wmind-api
          cache-to: type=gha,mode=max,scope=wmind-api

      - name: Verify fresh uploads volume permissions
        run: |
          volume_name="wmind-uploads-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker volume rm "$volume_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker volume create "$volume_name" >/dev/null
          docker run --rm --pull=always --platform linux/amd64 \
            --mount "type=volume,source=$volume_name,target=/data/uploads" \
            --entrypoint /bin/sh "ghcr.io/woliubang256/wmind-api:$GITHUB_REF_NAME" -ec '
              test "$(id -u)" -eq 10001
              touch /data/uploads/.wmind-permission-probe
              rm /data/uploads/.wmind-permission-probe
            '

      - name: Build and publish Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/woliubang256/wmind-web:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha,scope=wmind-web
          cache-to: type=gha,mode=max,scope=wmind-web

      - name: Smoke-test SQLite deployment
        env:
          HTTP_PORT: '0'
          WMIND_JWT_SECRET: ci-only-release-smoke-secret-not-for-production
          WMIND_ADMIN_EMAIL: ''
          WMIND_ADMIN_PASSWORD: ''
        run: |
          project="wmind-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          compose() {
            docker compose --project-name "$project" --env-file /dev/null -f deploy/docker-compose.yml "$@"
          }
          cleanup() {
            compose down --volumes --remove-orphans >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          compose pull
          compose up -d --no-build --wait --wait-timeout 90
          address=$(compose port web 80 | head -n 1)
          base="http://127.0.0.1:${address##*:}"
          site_config="$RUNNER_TEMP/wmind-smoke-site-config.json"
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 \
            --max-time 10 "$base/api/v1/site/config" > "$site_config"
          node -e '
            const { readFileSync } = require("node:fs");
            const { data } = JSON.parse(readFileSync(process.argv[1], "utf8"));
            if (data.version !== process.env.GITHUB_REF_NAME) throw new Error("Runtime version mismatch");
          ' "$site_config"
          backup_headers="$RUNNER_TEMP/wmind-smoke-backup-headers.txt"
          backup_status=$(curl --silent --show-error --dump-header "$backup_headers" --output /dev/null --write-out '%{http_code}' \
            "$base/api/v1/admin/backups")
          test "$backup_status" = '401'
          ! grep -qi '^location:' "$backup_headers"
          compose exec -T api sh -ec 'printf "%s" "wmind-upload-probe" > /data/uploads/wmind-release-upload-smoke.txt'
          uploaded=$(curl --fail --silent --show-error "$base/uploads/wmind-release-upload-smoke.txt")
          test "$uploaded" = 'wmind-upload-probe'
          missing_status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            "$base/uploads/wmind-release-missing-smoke.txt")
          test "$missing_status" = '404'

      - name: Promote both images to latest
        run: |
          docker buildx imagetools create --tag "ghcr.io/woliubang256/wmind-api:latest" "ghcr.io/woliubang256/wmind-api:$GITHUB_REF_NAME"
          docker buildx imagetools create --tag "ghcr.io/woliubang256/wmind-web:latest" "ghcr.io/woliubang256/wmind-web:$GITHUB_REF_NAME"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: wmind ${{ github.ref_name }}
          body_path: release/CHANGELOG.md
          files: |
            release/*.tar.gz
            release/SHA256SUMS
            release/CHANGELOG.md
          fail_on_unmatched_files: true
          draft: false
