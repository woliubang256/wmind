name: Desktop release

# 桌面版发布：推 desktop-v<版本> 标签触发。
#
# 成本考量（macOS / Windows runner 按分钟计费，比 ubuntu 贵一个数量级）：
#
#   packages  ubuntu-24.04  go test + Windows 两个包（zip、NSIS 安装包）
#   dmg       macos-latest  构建 darwin/arm64 与 darwin/amd64 的 .app，再出 .dmg
#   publish   ubuntu-24.04  汇总产物、建 Release
#
# 为什么 darwin 必须在 macOS 上构建：mygo 只在 macOS 上产出 `.app` 包
# （Info.plist、Resources、图标、签名都是 macOS 独有的），在 Linux 上交叉编译
# darwin 只得到一个裸可执行文件。1.1.0 第一次跑发布时就是卡在这里。
#
# 代价是 macOS runner 要多跑一次前端构建与两次 Go 编译（约 5–7 分钟）；相比
# 让发布直接失败，这个成本值得。Windows 安装包仍然在 ubuntu 上用 apt nsis 出。
#
# 为什么 macOS 的美化可能不生效：DMG 窗口的图标位置靠 Finder 自动化摆，runner
# 上可能没有自动化授权；驱动不了会打警告并回退朴素窗口（不影响安装与更新）。
#
# 前置条件（仓库 Settings → Secrets）：
#   MYGO_UPDATER_PRIVATE_KEY  mygo keygen 生成的 mygo-update.key 内容；
#                             没有它构建出的版本无法被已安装的客户端升级。
on:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  packages:
    name: Build packages (ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: desktop/go.sum

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.8
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # 标签必须与 VERSION 一致：否则安装包、更新清单和 tag 会各说各话。
      - name: Verify tag matches VERSION
        run: |
          tag_version="${GITHUB_REF_NAME#desktop-v}"
          file_version="$(cat VERSION)"
          if [ "$tag_version" != "$file_version" ]; then
            echo "标签版本 $tag_version 与 VERSION $file_version 不一致" >&2
            exit 1
          fi
          node scripts/release.mjs check "v${tag_version}"

      - name: Install frontend dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Test desktop module
        run: cd desktop && go vet ./... && go test ./...

      # Windows 安装包（NSIS）在 ubuntu 上一条 apt 就有，比 macOS 上 brew 快得多。
      - name: Install NSIS
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nsis

      # 只出 Windows：darwin 的 .app 必须在 macOS 上构建（见文件头说明）。
      # 必须带 --package：只有 mygo 会产出 tar.gz、NSIS 安装包与更新清单；
      # 不带的话脚本只做一次裸 `go build`，上传阶段就找不到产物。
      - name: Build packages
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: node scripts/build-desktop.mjs --package --platform linux/amd64,linux/arm64,windows/amd64,windows/arm64

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: wmind-packages
          path: |
            desktop/build/**/*.zip
            desktop/build/**/*.deb
            desktop/build/**/PKGBUILD
            desktop/build/**/*.tar.gz
            desktop/build/**/*.delta
            desktop/build/**/*setup*.exe
            desktop/build/**/update-*.json
            desktop/build/**/install.sh
            desktop/build/**/install.ps1
            desktop/build/**/SHA256SUMS
          if-no-files-found: error

  dmg:
    name: Build DMGs (macOS)
    # 用 macos-latest 而不是 macos-14：实测本仓库上 macos-14 标签的任务会被
    # 立刻取消（从未分配到 runner），macos-latest / macos-15 正常。
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: desktop/go.sum

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.8
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir web install --frozen-lockfile

      # 只编 darwin：Windows 的包在 ubuntu 作业里出过了。
      # --package 会先让 mygo 产出 .app / tar.gz / 更新清单，再用 hdiutil 出 dmg。
      - name: Build macOS apps and DMGs
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: node scripts/build-desktop.mjs --package --platform darwin/arm64,darwin/amd64

      - name: Upload DMGs
        uses: actions/upload-artifact@v4
        with:
          name: wmind-dmg
          path: |
            desktop/build/darwin-*/*.dmg
            desktop/build/darwin-*/*.tar.gz
            desktop/build/darwin-*/*.delta
            desktop/build/darwin-*/update-*.json
            desktop/build/darwin-*/install.sh
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [packages, dmg]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
          pattern: wmind-*

      # --latest=false：桌面版发布不能抢 Web 版 v* 的「最新」位置。
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version="${tag#desktop-v}"

          # 只发布用户要下载的东西：dmg / zip / NSIS 安装包 / 更新归档 / 增量补丁 / 更新清单。
          # install.sh、SHA256SUMS 之类在归档里已经有了，而且各平台同名，
          # 合并上传会撞名（ReleaseAsset.name already exists）。
          mapfile -t raw < <(find artifacts -type f \( \
            -name '*.dmg' -o -name '*.zip' -o -name '*.deb' -o -name '*setup*.exe' -o \
            -name '*.tar.gz' -o -name '*.delta' -o -name 'PKGBUILD' -o -name 'update-*.json' \) | sort)
          if [ ${#raw[@]} -eq 0 ]; then
            echo "没有可发布的产物" >&2
            exit 1
          fi

          # 同名只留第一个（同一份产物被两个作业都带上时）。
          declare -A seen=()
          assets=()
          for file in "${raw[@]}"; do
            name="$(basename "$file")"
            if [ -n "${seen[$name]:-}" ]; then
              echo "跳过重名产物：$name（${file}）"
              continue
            fi
            seen[$name]=1
            assets+=("$file")
          done

          # 重跑同一个标签时先清掉旧发布，否则 gh 会报 422（同名资产已存在）。
          # 这个作业不 checkout（只下产物），gh 无法推断仓库，必须显式给 --repo。
          gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes >/dev/null 2>&1 || true
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --title "Wmind 桌面版 $version" "${assets[@]}"
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
          printf '%s\n' "${assets[@]}"
