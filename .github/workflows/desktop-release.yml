name: Desktop release

# 桌面版发布：推 desktop-v<版本> 标签触发。
#
# 为什么不并进 ci.yml：那条工作流是 **Web 版**发布（构建镜像、推 latest、
# 发 Release），桌面版只出安装包与更新清单，两边的产物与副作用完全不同，
# 合并会让一次桌面发布顺手重推一遍 Web 镜像。
#
# 为什么分成两个作业：macOS 的 .dmg 要靠 Finder 自动化摆图标、Windows 安装包
# 要靠 NSIS，这些都只在 macOS 上做；Linux 的 AppImage 只能靠 appimagetool 在
# Linux 上打。两边各自出产物，最后一个作业汇总发布，避免两个作业抢着建 Release。
#
# 前置条件（仓库 Settings → Secrets）：
#   MYGO_UPDATER_PRIVATE_KEY  mygo keygen 生成的 mygo-update.key 内容；
#                             没有它构建出的版本无法被已安装的客户端升级。
on:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS + Windows
            os: macos-14
            platforms: darwin/arm64,darwin/amd64,windows/amd64,windows/arm64
          - name: Linux
            os: ubuntu-24.04
            platforms: linux/amd64,linux/arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: backend/desktop/go.sum

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.8
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # 标签必须与 VERSION 一致：否则安装包、更新清单和 tag 会各说各话。
      - name: Verify tag matches VERSION
        run: |
          tag_version="${GITHUB_REF_NAME#desktop-v}"
          file_version="$(cat VERSION)"
          if [ "$tag_version" != "$file_version" ]; then
            echo "标签版本 $tag_version 与 VERSION $file_version 不一致" >&2
            exit 1
          fi
          node scripts/release.mjs check "v${tag_version}"

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Test desktop module
        run: cd backend/desktop && go vet ./... && go test ./...

      # Windows 安装包（NSIS）需要 makensis：Linux 用 apt，macOS 用 brew。
      - name: Install NSIS
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then brew install nsis; else sudo apt-get update && sudo apt-get install -y --no-install-recommends nsis; fi

      - name: Build packages
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: node scripts/build-desktop.mjs --platform "${{ matrix.platforms }}"

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: wmind-desktop-${{ runner.os }}
          path: |
            backend/desktop/build/**/*.dmg
            backend/desktop/build/**/*.zip
            backend/desktop/build/**/*.AppImage
            backend/desktop/build/**/*.tar.gz
            backend/desktop/build/**/*setup*.exe
            backend/desktop/build/**/update-*.json
            backend/desktop/build/**/install.sh
            backend/desktop/build/**/install.ps1
            backend/desktop/build/**/SHA256SUMS
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # --latest=false：桌面版发布不能抢 Web 版 v* 的「最新」位置。
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version="${tag#desktop-v}"
          mapfile -t assets < <(find artifacts -type f | sort)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "没有可发布的产物" >&2
            exit 1
          fi
          gh release create "$tag" --draft --title "wmind 桌面版 $version" "${assets[@]}"
          gh release edit "$tag" --draft=false --latest=false
          printf '%s\n' "${assets[@]}"
