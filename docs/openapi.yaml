      responses:
        '200':
          description: 操作成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/BackupState' }
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'

  /api/v1/admin/backups/test:
    post:
      tags: [admin]
      summary: 测试远端写入与删除权限
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BackupConfiguration' }
      responses:
        '200':
          description: 操作成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'

  /api/v1/admin/backups/run:
    post:
      tags: [admin]
      summary: 立即创建一次异步备份任务
      responses:
        '201':
          description: 操作成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/BackupJob' }
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'

  /api/v1/admin/backups/schedule:
    post:
      tags: [admin]
      summary: 校验五段 Cron 并计算五次后续执行
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BackupSchedule' }
      responses:
        '200':
          description: 操作成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/BackupScheduleResult' }
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'

  /api/v1/admin/backups/restore/preview:
    post:
      tags: [admin]
      summary: 上传 ZIP 并校验兼容性，不修改业务数据
      requestBody:
        required: true
        content:
          application/zip:
            schema: { type: string, format: binary, maxLength: 2147483648 }
      responses:
        '200':
          description: 操作成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/BackupRestorePreview' }
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'

  /api/v1/admin/backups/restore:
    post:
      tags: [admin]
      summary: 确认覆盖恢复，仅接受本管理员上传的暂存令牌
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BackupRestoreRequest' }
      responses:
        '201':
          description: 操作成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/BackupJob' }
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access Token，15 分钟。放在响应体里由客户端保存，不落 Cookie（避免 CSRF）。
    refreshCookie:
      type: apiKey
      in: cookie
      name: wmind_refresh
      description: 刷新令牌，7 天，`HttpOnly` + `SameSite=Lax` + `Path=/api/v1/auth`。

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      description: 上限由服务端收敛，传大了不会报错，只会被夹到上限。
      schema: { type: integer, minimum: 1, default: 20 }
    MapUid:
      name: uid
      in: path
      required: true
      schema: { type: string }

  responses:
    Error:
      description: 统一错误信封
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    RegistrationClosed:
      description: 站点已关闭注册。**不会**因为连打多次而变成 429——关站判定在限流器之前。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ValidationFailed:
      description: 字段校验失败，`error.details.fields` 里是「字段名 → 一句话」
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    RateLimited:
      description: 触发限流，`error.details.retryAfter` 是建议等待秒数，同时带 `Retry-After` 头
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    TooManyAttempts:
      description: 连续登录失败后的锁定。锁定期内**正确密码也会被拒**。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  schemas:
    BackupConfiguration:
      type: object
      required: [enabled, cron, timezone, target, webdav, s3]
      properties:
        enabled: { type: boolean, default: false }
        cron: { type: string, example: '0 3 * * *' }
        timezone: { type: string, example: Asia/Shanghai }
        target: { type: string, enum: [webdav, s3] }
        webdav:
          type: object
          properties:
            url: { type: string }
            username: { type: string }
            password: { type: string, writeOnly: true, description: 留空保留已有密码 }
            passwordSet: { type: boolean, readOnly: true }
        s3:
          type: object
          properties:
            endpoint: { type: string, description: 留空使用 AWS S3 }
            region: { type: string }
            bucket: { type: string }
            prefix: { type: string }
            pathStyle: { type: boolean }
            accessKey: { type: string, writeOnly: true }
            secretKey: { type: string, writeOnly: true }
            sessionToken: { type: string, writeOnly: true }
            clearSessionToken: { type: boolean, writeOnly: true }
            accessKeySet: { type: boolean, readOnly: true }
            secretKeySet: { type: boolean, readOnly: true }
            sessionTokenSet: { type: boolean, readOnly: true }
    BackupJob:
      type: object
      properties:
        id: { type: string }
        kind: { type: string, enum: [backup, restore] }
        trigger: { type: string, enum: [manual, schedule] }
        status: { type: string, enum: [running, succeeded, failed] }
        stage: { type: string }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        filename: { type: string }
        bytes: { type: integer }
        errorCode: { type: string }
        recoveryFile: { type: string, description: 服务器本地恢复前 ZIP 的文件名 }
    BackupState:
      type: object
      properties:
        configuration: { $ref: '#/components/schemas/BackupConfiguration' }
        nextRuns: { type: array, items: { type: string, format: date-time } }
        current: { $ref: '#/components/schemas/BackupJob' }
        history: { type: array, items: { $ref: '#/components/schemas/BackupJob' } }
        busy: { type: boolean }
        maxUploadBytes: { type: integer }
    BackupSchedule:
      type: object
      required: [cron, timezone]
      properties:
        cron: { type: string }
        timezone: { type: string }
    BackupScheduleResult:
      type: object
      properties:
        nextRuns: { type: array, items: { type: string, format: date-time } }
    BackupRestorePreview:
      type: object
      properties:
        id: { type: string, description: 绑定上传管理员的一次性令牌 }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        database:
          type: object
          properties:
            driver: { type: string }
            schema: { type: integer }
        files: { type: integer }
        bytes: { type: integer }
    BackupRestoreRequest:
      type: object
      required: [id, confirm]
      properties:
        id: { type: string }
        confirm: { type: boolean, const: true }

    Envelope:
      type: object
      required: [data]
      properties:
        data: {}
        requestId: { type: string, description: ULID，用于和日志对账 }

    PagedEnvelope:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: {}
        pagination: { $ref: '#/components/schemas/Pagination' }
        requestId: { type: string }

    Pagination:
      type: object
      required: [page, pageSize, total, totalPages]
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer, format: int64 }
        totalPages: { type: integer }

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message:
              type: string
              description: 给人看的默认文案（中文）。客户端应优先按 `code` 分支——这句话会随界面语言变化。
            details:
              type: object
              additionalProperties: true
        requestId: { type: string }

    ErrorCode:
      type: string
      description: 稳定契约。完整表见 `docs/04-后端设计与API规范.md` §3.2。
      enum:
        - BACKUP_BUSY
        - BACKUP_CONFIG_INVALID
        - BACKUP_REMOTE_FAILED
        - BACKUP_ARCHIVE_INVALID
        - BACKUP_STAGE_INVALID
        - BAD_REQUEST
        - VALIDATION_FAILED
        - RESOURCE_NOT_FOUND
        - INTERNAL_ERROR
        - SERVICE_UNAVAILABLE
        - RATE_LIMITED
        - AUTH_2FA_INVALID
        - AUTH_2FA_EXPIRED
        - AUTH_2FA_STATE
        - AUTH_INVALID_CREDENTIALS
        - AUTH_TOKEN_EXPIRED
        - AUTH_TOKEN_INVALID
        - AUTH_REFRESH_INVALID
        - AUTH_ACCOUNT_PENDING
        - AUTH_ACCOUNT_DISABLED
        - AUTH_FORBIDDEN
        - AUTH_EMAIL_TAKEN
        - AUTH_USERNAME_TAKEN
        - AUTH_TOO_MANY_ATTEMPTS
        - REGISTRATION_CLOSED
        - MAP_LIMIT_REACHED
        - MAP_NOT_FOUND
        - MAP_VERSION_CONFLICT
        - SHARE_DISABLED
        - SHARE_LIMIT_REACHED
        - SHARE_PASSWORD_REQUIRED
        - SHARE_PASSWORD_INVALID
        - SHARE_NOT_FOUND
        - TEMPLATE_NOT_FOUND
        - TEMPLATE_BUILTIN_READONLY
        - THEME_NOT_FOUND
        - THEME_BUILTIN_READONLY
        - THEME_LIMIT_REACHED
        - FILE_NOT_FOUND
        - FILE_TOO_LARGE
        - FILE_TYPE_NOT_ALLOWED
        - DOCUMENT_TOO_LARGE
        - DOCUMENT_INVALID
        - IMPORT_FORMAT_UNSUPPORTED
        - IMPORT_PARSE_FAILED
        - EXPORT_DISABLED
        - EXPORT_RENDER_FAILED
        - SETTINGS_INVALID
        - ADMIN_LAST_ADMIN
        - ADMIN_CANNOT_DELETE_SELF
        - ADMIN_CANNOT_RESET_SELF
        - MAIL_SEND_FAILED
        - MAIL_NOT_CONFIGURED
        - ENCRYPTION_KEY_MISSING

    SiteConfig:
      type: object
      required:
        - siteName
        - registrationEnabled
        - passwordMinLength
        - shareEnabled
        - version
      properties:
        siteName: { type: string }
        logoUrl: { type: string }
        description: { type: string }
        icp: { type: string }
        registrationEnabled: { type: boolean }
        passwordMinLength: { type: integer }
        importEnabled: { type: boolean }
        exportEnabled: { type: boolean }
        userTemplateEnabled: { type: boolean }
        shareEnabled: { type: boolean }
        shareDefaultExpireDays:
          type: integer
          description: 新建分享链接时的默认有效期（天）；0 表示永久
        shareDefaultAllowDownload: { type: boolean }
        version: { type: string }

    RegisterInput:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
          pattern: '^[a-zA-Z0-9_-]{3,32}$'
          description: 允许字母、数字、下划线与短横线——它要出现在 URL 里
        email: { type: string, format: email }
        password:
          type: string
          description: 长度下限由站点设置 `auth.password_min_length` 决定，上限受 bcrypt 72 字节约束
        nickname: { type: string, maxLength: 32 }

    LoginInput:
      type: object
      required: [identifier, password]
      properties:
        identifier: { type: string, description: 邮箱或用户名 }
        password: { type: string }

    TwoFactorChallenge:
      type: object
      required: [twoFactorRequired, challengeToken, expiresIn]
      properties:
        twoFactorRequired: { type: boolean, const: true }
        challengeToken: { type: string, description: 仅用于第二步，不能作为访问令牌 }
        expiresIn: { type: integer, const: 300 }
    TwoFactorVerifyInput:
      type: object
      required: [challengeToken, code]
      properties:
        challengeToken: { type: string }
        code: { type: string, description: 六位验证器验证码或一次性恢复码 }
    TwoFactorPasswordInput:
      type: object
      required: [password]
      properties:
        password: { type: string, format: password }
    TwoFactorManageInput:
      type: object
      required: [password, code]
      properties:
        password: { type: string, format: password }
        code: { type: string }
    TwoFactorStatus:
      type: object
      required: [enabled, recoveryCodesRemaining]
      properties:
        enabled: { type: boolean }
        recoveryCodesRemaining: { type: integer }
    TwoFactorSetup:
      type: object
      required: [secret, uri, qrCode, expiresIn]
      properties:
        secret: { type: string }
        uri: { type: string, format: uri }
        qrCode: { type: string, description: 本地生成 PNG 的 data URL }
        expiresIn: { type: integer, const: 600 }
    TwoFactorChange:
      type: object
      properties:
        session: { $ref: '#/components/schemas/AuthSession' }
        recoveryCodes:
          type: array
          description: 仅启用或重新生成时返回明文，必须立即保存
          items: { type: string }

    AuthSession:
      type: object
      required: [accessToken, expiresIn, user]
      properties:
        accessToken: { type: string }
        expiresIn: { type: integer, description: 秒 }
        user: { $ref: '#/components/schemas/User' }

    User:
      type: object
      required: [uid, username, email, role, status, createdAt]
      properties:
        uid: { type: string }
        username: { type: string }
        email: { type: string }
        nickname: { type: string }
        avatarUrl: { type: string }
        role: { type: string, enum: [user, admin] }
        status: { type: string, enum: [active, disabled, pending] }
        mapCount: { type: integer }
        storageUsedBytes: { type: integer, format: int64 }
        lastLoginAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }

    WmindDocument:
      type: object
      description: |
        自有文档格式，结构对齐 XMind `content.json`。完整规范见
        `docs/03-数据模型与文件格式.md` §2；这里只钉住最外层，内部字段随编辑器
        演进，客户端应以那份文档为准。
      required: [format, version, title, sheets]
      properties:
        format: { type: string, const: wmind }
        version: { type: integer }
        title: { type: string }
        themeId: { type: string }
        meta:
          type: object
          properties:
            createdAt: { type: integer }
            updatedAt: { type: integer }
        sheets:
          type: array
          items: { type: object, additionalProperties: true }

    MapSummary:
      type: object
      required: [uid, title, version, deleted, createdAt, updatedAt]
      properties:
        uid: { type: string }
        title: { type: string }
        thumbnailUrl: { type: string, description: 站内相对路径；空串表示没有 }
        nodeCount: { type: integer }
        sizeBytes: { type: integer, format: int64 }
        version: { type: integer }
        deleted: { type: boolean }
        deletedAt: { type: string, format: date-time, description: 'Present for trashed maps; preserves deletion timestamp precision.' }
        expiresAt: { type: string, format: date-time, description: 'Trash list only; deletedAt plus the current global trash.retention_days policy.' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    MapDetail:
      allOf:
        - $ref: '#/components/schemas/MapSummary'
        - type: object
          required: [document]
          properties:
            document: { $ref: '#/components/schemas/WmindDocument' }

    CreateMapInput:
      type: object
      required: [title, document]
      properties:
        title: { type: string, maxLength: 200 }
        document: { $ref: '#/components/schemas/WmindDocument' }

    SaveResult:
      type: object
      required: [uid, version, nodeCount, updatedAt]
      properties:
        uid: { type: string }
        version: { type: integer }
        nodeCount: { type: integer }
        updatedAt: { type: string, format: date-time }

    ShareLink:
      type: object
      required: [uid, token, url, mapUid, hasPassword, allowDownload, showNotes, createdAt]
      properties:
        uid: { type: string }
        token: { type: string }
        url:
          type: string
          description: |
            完整链接或站内相对路径。站点没配 `site.base_url` 时只回 `/s/<token>`，
            由客户端用当前 origin 补全——服务端在反代后面看到的 Host 常常不是
            用户访问的那个域名。
        mapUid: { type: string }
        mapTitle: { type: string }
        hasPassword: { type: boolean }
        allowDownload: { type: boolean }
        showNotes: { type: boolean }
        expiresAt: { type: [string, 'null'], format: date-time }
        viewCount: { type: integer }
        lastViewedAt: { type: [string, 'null'], format: date-time }
        revokedAt:
          type: [string, 'null']
          format: date-time
          description: 非空表示已撤销。撤销后的链接仍留在列表里，以便保留访问统计。
        createdAt: { type: string, format: date-time }

    CreateShareInput:
      type: object
      properties:
        password: { type: string, description: 省略或空串表示不设密码 }
        expiresInDays: { type: integer, minimum: 0, description: 0 或省略表示永久 }
        allowDownload: { type: boolean }
        showNotes: { type: boolean }

    UpdateShareInput:
      type: object
      properties:
        password:
          type: [string, 'null']
          description: 传字符串表示设置，`null` 表示清除，不传表示不改
        expiresInDays: { type: integer, minimum: 0 }
        allowDownload: { type: boolean }
        showNotes: { type: boolean }

    PublicShare:
      type: object
      required: [title, document, allowDownload, showNotes, siteName]
      description: 刻意不含属主的 uid 与邮箱。
      properties:
        title: { type: string }
        document: { $ref: '#/components/schemas/WmindDocument' }
        allowDownload: { type: boolean }
        showNotes: { type: boolean }
        siteName: { type: string }
        logoUrl: { type: string }
        ownerNickname: { type: string }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: [string, 'null'], format: date-time }

    ShareAccess:
      type: object
      required: [accessToken, expiresIn]
      properties:
        accessToken: { type: string }
        expiresIn: { type: integer, description: 秒 }

    CustomTheme:
      type: object
      required: [uid, name, config, createdAt, updatedAt]
      properties:
        uid: { type: string }
        name: { type: string }
        category: { type: string, description: 一期恒为 custom }
        config:
          type: object
          description: 一整份 Theme 对象（调色板 + 全局字体字号 + 各角色样式 + 彩虹开关 + 布局开关），不是只有调色板
          additionalProperties: true
        sortOrder: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ThemeInput:
      type: object
      required: [name, config]
      properties:
        name: { type: string, maxLength: 60 }
        config:
          type: object
          additionalProperties: true

    TemplateSummary:
      type: object
      required: [uid, name, structure, isBuiltin, createdAt, updatedAt]
      properties:
        uid: { type: string }
        name: { type: string }
        category: { type: string, description: 一期恒为 user }
        structure:
          type: string
          enum: [mindmap, logic, brace, org, tree, timeline, fishbone, table]
        thumbnailUrl: { type: string }
        isBuiltin: { type: boolean, description: 一期恒为 false }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    TemplateDetail:
      allOf:
        - $ref: '#/components/schemas/TemplateSummary'
        - type: object
          required: [document]
          properties:
            document: { $ref: '#/components/schemas/WmindDocument' }

    UploadedFile:
      type: object
      required: [uid, url, width, height, format, bytes]
      properties:
        uid: { type: string }
        url: { type: string, description: 站内相对路径 }
        width: { type: integer }
        height: { type: integer }
        format: { type: string, enum: [png, jpeg, gif, webp] }
        bytes: { type: integer, format: int64 }

    ResetPasswordResult:
      type: object
      required: [password, generated]
      properties:
        password: { type: string, description: 明文，只此一次 }
        generated: { type: boolean, description: true 表示服务端随机生成 }

    AdminStats:
      type: object
      required: [userCount, activeUserCount, mapCount, mapCountToday, storageUsedBytes, trend]
      properties:
        userCount: { type: integer }
        activeUserCount: { type: integer }
        mapCount: { type: integer }
        mapCountToday: { type: integer }
        storageUsedBytes: { type: integer, format: int64 }
        trend:
          type: array
          items:
            type: object
            properties:
              date: { type: string, format: date }
              newUsers: { type: integer }
              newMaps: { type: integer }

    AuditLog:
      type: object
      required: [id, action, targetType, targetId, createdAt]
      properties:
        id: { type: integer, format: int64 }
        actorId: { type: [integer, 'null'], format: int64 }
        action: { type: string }
        targetType: { type: string }
        targetId: { type: string }
        detail:
          type: object
          additionalProperties: true
        ip: { type: string }
        createdAt: { type: string, format: date-time }

    SettingsMap:
      type: object
      description: |
        键值对，值是字符串 / 数字 / 布尔。键表见 `docs/03-数据模型与文件格式.md`
        §4.6；常用键：`site.name`、`auth.registration_enabled`、
        `auth.password_min_length`、`share.public_link_enabled`、
        `feature.import_enabled`、`feature.export_enabled`。
      additionalProperties:
        type: [string, integer, boolean]
